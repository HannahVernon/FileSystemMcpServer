name: Bug Report
description: Report a bug in FileSystemMcpServer
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Send JSON-RPC request ...
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or JSON-RPC responses if available.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g., Windows 11, Ubuntu 24.04, macOS 15"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK version
      placeholder: "e.g., 10.0.100"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "e.g., LM Studio 0.3.8, Ollama 0.6.2"
    validations:
      required: false
